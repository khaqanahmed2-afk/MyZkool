  <!--
    Font loading strategy:
    - preconnect to reduce DNS + TLS handshake time
    - Only load weights actually used in the design system:
        Inter: 400 (body), 500 (medium), 600 (semibold), 700 (bold)
        Plus Jakarta Sans: 600 (semibold), 700 (bold), 800 (extra-bold)
    - font-display=swap prevents FOIT (invisible text during font load)
    - The &display=swap parameter is added to the CSS2 URL
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
    media="print"
    onload="this.media='all'"
  />
  <!-- Fallback for no-JS environments -->
  <noscript>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
    />
  </noscript>
</head>
